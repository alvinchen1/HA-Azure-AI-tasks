# The pytest gate.
#
# This lives under .gitea/ rather than .github/ deliberately: the Gitea ->
# GitHub push mirror uses a token without the `workflow` scope, so GitHub
# rejects any push that touches .github/workflows - which would block releases
# entirely. Gitea is the canonical host, so the gate runs here.
name: "Tests"

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt
      - name: Run pytest
        run: pytest tests -q
